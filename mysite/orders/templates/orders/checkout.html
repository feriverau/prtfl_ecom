{% extends 'myapp/base.html' %}

{% block body %}
<div class="flex flex-col items-center min-h-screen p-10">
    <h1 class="text-3xl font-bold mb-2">Checkout</h1>
    <p class="text-gray-600 mb-6">
        Complete su orden confirmando la dirección de envío.
    </p>

    <form method="POST" class="shadow-lg rounded-lg p-10 w-96 space-y-5 bg-white">
        {% csrf_token %}

        <div>
            <label class="block mb-1 font-medium">Nombre Completo</label>
            <input type="text" value="{{ address.full_name }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Dirección 1</label>
            <input type="text" value="{{ address.line1 }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Dirección 2</label>
            <input type="text" value="{{ address.line2 }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Ciudad</label>
            <input type="text" value="{{ address.city }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Región</label>
            <input type="text" value="{{ address.region }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Código Postal</label>
            <input type="text" value="{{ address.postal_code }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
            <label class="block mb-1 font-medium">Provincia</label>
            <input type="text" value="{{ address.province }}" readonly
                class="w-full border rounded p-2 bg-gray-100">
        </div>

        <button type="submit"
            class="w-full bg-gray-900 text-white py-2 rounded hover:bg-blue-700 transition">
            Completar Orden
        </button>
    </form>
</div>
<script>
    $(document).on("submit",function(e){
        e.preventDefault();
        $.ajax({
            type:"POST",
            url:"{% url 'place-order' %}",
            data: {
                csrfmiddlewaretoken:"{{csrf_token}}",
                action:"post",
            },
            success:function(json){
                window.location.replace("{% url 'order-success' %}")
            },
            error:function(){
                window.location.replace("{% url 'order-failed' %}")
            },
        });
    });
</script>
{% endblock %}
