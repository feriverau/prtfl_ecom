{% load humanize %}
{% load price_filters %}

<div class="rounded-lg shadow-lg p-4 overflow-hidden">

    <a href="{{ product.get_absolute_url }}">
        <img
            class="rounded-md mb-4 w-full h-64 object-contain mx-auto"
            src="{{ product.image.url }}"
            alt="{{ product.name }}"
        >
    </a>

    <a
        class="text-lg font-semibold block"
        href="{{ product.get_absolute_url }}"
    >
        {{ product.name }}
    </a>

    <p class="text-gray-600 line-clamp-2">
        {{ product.description }}
    </p>

    <p class="text-green-500 font-bold mt-2 text-lg">
        ${{ product.price|clp }}
    </p>

</div>
