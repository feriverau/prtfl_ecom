{% extends 'myapp/base.html' %}

{% block body %}

<div class="flex flex-col justify-center items-center min-h-screen">
    <h1>FriendlEcom</h1>
    <form method="POST" class="shadow-lg p-10 space-y-10">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="bg-red-500 text-white p-2">
            {% for error in form.non_field_errors %}
            <p>{{error}}</p>
            {% endfor %}
        </div>
        {% endif %}
        <div>
            <label for="">Usuario</label>
            <div class="border rounded p-2">{{form.username}}</div>
        </div>
        <div>
            <label for="">Contraseña</label>
            <div class="border rounded p-2">{{form.password}}</div>
        </div>
        <button
            type="submit"
            class="w-full h-12 bg-gray-900 hover:bg-gray-800 active:bg-black active:scale-[0.98] transition-all duration-150 text-white font-semibold rounded-lg flex items-center justify-center"
        >
            Ingresar
        </button>

        <a
            href="{% url 'register' %}"
            class="w-full h-12 bg-gray-900 hover:bg-gray-800 active:bg-black active:scale-[0.98] transition-all duration-150 text-white font-semibold rounded-lg flex items-center justify-center"
        >
            Registrarse
        </a>

    </form>
    
</div>

{% endblock %}
